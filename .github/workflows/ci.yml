name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
#
# push is filtered to the branches that are merge targets. Without the filter
# every push to a feature branch ran the whole pipeline AND the pull_request
# event ran it again on the same commit - measured at 21 jobs and ~95 billable
# minutes per run, so exactly double for no extra information. A branch with no
# pull request open is covered by `mdl ci <repo> --matrix` locally.
on:
  push:
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token for every job. uaiblaine/moodle-workflows declares the same
# block itself; artifact uploads use the runner's own token, not this one.
permissions:
  contents: read

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these jobs when the supported range changes,
  # in the same commit as the version.php change. The highest branch runs the
  # full PHP x DB matrix; older branches run one DB only. PHPUnit and Behat
  # run on every runtime leg.
  #
  # The jobs call uaiblaine/moodle-workflows (MAH plus the fork's additions). `runner`
  # sends them to the LAN CI hosts' self-hosted runners when the repository variable
  # CI_RUNNER is set (`mdl runner add <repo>`); a pull request from a fork always stays on
  # GitHub's ubuntu-24.04, and the hosts refuse code from forks anyway.
  #
  # customfield_pattern is a hard dependency (version.php) and has one branch, main, for every
  # Moodle version this plugin has a branch for.
  ci-501:
    name: Moodle 5.01
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      moodle-core-branch: MOODLE_501_STABLE
      plugin-dependencies: uaiblaine/moodle-customfield_pattern,main
