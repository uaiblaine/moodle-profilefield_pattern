# Mutation spec for profilefield_pattern: run with
# `mdl mutate moodle-profilefield_pattern /Users/uaiblaine/dev/moodle-profilefield_pattern/mutations/gates.conf --fast --db pgsql`
# (and --db mariadb).
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it.
#
#     tag | file relative to the repo | perl script relative to this file

# --- Validation and storage ------------------------------------------------------------------------
P1_locked_field_validated | field.class.php | p1_locked_field_validated.pl
#   -> field_class_test::test_locked_field_is_not_validated_for_the_user

P2_locked_skip_for_admins_too | field.class.php | p2_locked_skip_for_admins_too.pl
#   -> field_class_test::test_locked_field_is_not_validated_for_the_user

P3_locked_value_shown_raw | field.class.php | p3_locked_value_shown_raw.pl
#   -> field_class_test::test_locked_field_shows_the_formatted_value

P4_uniqueness_on_typed_shape | field.class.php | p4_uniqueness_on_typed_shape.pl
#   -> field_class_test::test_uniqueness_compares_normalised_values
#   -> field_class_test::test_uniqueness_finds_a_masked_value_typed_raw

P5_rejected_value_saved | field.class.php | p5_rejected_value_saved.pl
#   -> field_class_test::test_save_without_validation_keeps_the_stored_value
#   -> field_class_test::test_save_without_validation_refuses_mask_and_length_errors
#   -> field_class_test::test_update_users_web_service_refuses_a_rejected_value

P12_stored_value_refusal_traced | field.class.php | p12_stored_value_refusal_traced.pl
#   -> field_class_test::test_locked_field_save_of_the_stored_value_is_silent

P6_refusal_untraced | field.class.php | p6_refusal_untraced.pl
#   -> field_class_test::test_save_without_validation_keeps_the_stored_value
#   -> field_class_test::test_save_without_validation_refuses_mask_and_length_errors
#   -> field_class_test::test_update_users_web_service_refuses_a_rejected_value

# --- Privacy ---------------------------------------------------------------------------------------
P7_export_shared_subcontext | classes/privacy/provider.php | p7_export_shared_subcontext.pl
#   -> provider_test::test_export_keeps_every_field_and_restores_the_mask

# --- Rewrite after a settings change ---------------------------------------------------------------
P8_settings_change_not_queued | define.class.php | p8_settings_change_not_queued.pl
#   -> renormalise_values_test::test_a_settings_change_queues_the_task

P9_unchanged_settings_queued | define.class.php | p9_unchanged_settings_queued.pl
#   -> renormalise_values_test::test_a_settings_change_queues_the_task

P10_rejected_values_rewritten | classes/task/renormalise_values.php | p10_rejected_values_rewritten.pl
#   -> renormalise_values_test::test_execute_rewrites_accepted_values_only

P11_any_datatype_rewritten | classes/task/renormalise_values.php | p11_any_datatype_rewritten.pl
#   -> renormalise_values_test::test_execute_skips_a_missing_field
